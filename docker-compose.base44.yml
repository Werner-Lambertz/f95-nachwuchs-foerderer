services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_BASE44_APP_ID=${VITE_BASE44_APP_ID:-6a21b8605426a2a9bf55a069}
      - VITE_BASE44_APP_BASE_URL=${VITE_BASE44_APP_BASE_URL:-https://6a21b8605426a2a9bf55a069.base44.app}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
